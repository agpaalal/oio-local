name: OIO Local CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: macOS plugin and runtime tests
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out OIO Local
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install supported host CLIs
        run: >-
          npm install --global
          @openai/codex@0.149.1
          @anthropic-ai/claude-code@2.1.170
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Run Local-only tests
        run: npm test
